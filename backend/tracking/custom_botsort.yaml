# Custom BoT-SORT Tracker Settings for PitchTrack AI
# Optimized for small-sided football matches (10 players total, 5v5) and moving camera pans.
# Tuned to MAXIMIZE ID consistency:
#   - Re-ID (appearance embeddings) enabled to re-identify players after long occlusions
#   - High new_track_thresh: prevents noise/flicker from spawning ghost player IDs
#   - Long track_buffer: remembers lost players for ~10 seconds
#   - Strong appearance gating for ReID swaps (low cosine distance required to merge)

tracker_type: botsort
track_high_thresh: 0.35   # Strong enough for clean matches, low enough to keep distant players active.
track_low_thresh: 0.08    # Recover weak/occluded player detections instead of dropping the track.
new_track_thresh: 0.55    # Avoid ghost IDs, but do not block real players from entering the game.
track_buffer: 600         # ~20s @ 30fps. Keep identities alive through camera pans / occlusions.
match_thresh: 0.90        # More lenient association before spawning a new identity.
fuse_score: True          # Fuse detection score with IoU during matching (required by modern Ultralytics).

# BoT-SORT camera motion compensation
gmc_method: sparseOptFlow # Global Motion Compensation via sparse optical flow — critical for moving handheld camera pans.

# ReID — THE MOST IMPORTANT FIX FOR ID CONSISTENCY
# When a player goes behind another, leaves the frame, or the camera pans away and back,
# Re-ID uses appearance embeddings (cosine similarity of visual features) to recognize them
# and reassign their ORIGINAL ID instead of spawning a brand new one.
with_reid: True           # PREVIOUSLY FALSE — this was the #1 cause of ID inflation (5 players -> 36 IDs).
model: auto               # "auto" uses YOLOv8m's native backbone features (minimal overhead, no extra inference).
proximity_thresh: 0.35    # Let ReID help even when bbox overlap is weak after camera motion.
appearance_thresh: 0.20   # More forgiving appearance match before creating a fresh ID.
