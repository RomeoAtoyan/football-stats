# Custom BoT-SORT Tracker Settings for PitchTrack AI
# Optimized for small-sided football matches (10 players total) and moving camera pans

tracker_type: botsort # tracker type, ['botsort', 'bytetrack']
track_high_thresh: 0.30 # threshold for the first association (allow tracking in shadow/low-contrast)
track_low_thresh: 0.10 # threshold for the second association (keep tracking heavily occluded players)
new_track_thresh: 0.40 # threshold for initiating a new track (prevents brief noise from spawning new player IDs)
track_buffer: 90 # multi-object tracking memory buffer (remember lost players for 90 frames ~ 3 seconds at 30fps)
match_thresh: 0.70 # similarity threshold for matching (lower to allow matching across fast camera movements)
fuse_score: True # whether to fuse confidence score with IOU (required by modern Ultralytics BoT-SORT)

# BoT-SORT Specifics
gmc_method: sparseOptFlow # enables Global Motion Compensation using optical flow to handle camera pans and zooms!
proximity_thresh: 0.5 # proximity threshold for matching
appearance_thresh: 0.8 # appearance threshold for matching
with_reid: False # standard Re-ID is disabled to save computation; GMC is sufficient for camera motion compensation
