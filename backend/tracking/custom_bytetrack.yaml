# Custom ByteTrack Tracker Settings for PitchTrack AI
# Optimized for small-sided football matches (10 players total)

tracker_type: bytetrack # tracker type, ['botsort', 'bytetrack']
track_high_thresh: 0.40 # threshold for the first association (allow tracking in shadow/low-contrast)
track_low_thresh: 0.05 # threshold for the second association (keep tracking heavily occluded players)
new_track_thresh: 0.60 # threshold for initiating a new track (prevents brief noise from spawning new player IDs)
track_buffer: 240 # multi-object tracking memory buffer (remember lost players for 240 frames ~ 8 seconds at 30fps)
match_thresh: 0.85 # IOU threshold for matching tracks
fuse_score: True # whether to fuse confidence score with IOU (required by modern Ultralytics ByteTrack)
